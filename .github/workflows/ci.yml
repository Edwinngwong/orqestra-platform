name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orqestra
          POSTGRES_USER: orqestra
          POSTGRES_PASSWORD: orqestra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orqestra"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://orqestra:orqestra@127.0.0.1:5432/orqestra
      TEST_DATABASE_URL: postgres://orqestra:orqestra@127.0.0.1:5432/orqestra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
