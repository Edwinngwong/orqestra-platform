services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orqestra
      POSTGRES_USER: orqestra
      POSTGRES_PASSWORD: orqestra
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqestra"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - orqestra-postgres:/var/lib/postgresql/data
volumes:
  orqestra-postgres:
